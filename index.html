<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Super Bros</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b12;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;background:#5c94fc;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #touch{position:fixed;left:0;right:0;bottom:12px;display:none;justify-content:space-between;padding:0 12px;pointer-events:none}
  #touch div{display:flex;gap:8px;pointer-events:auto}
  #touch button{width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18);color:#fff;font-size:16px;font-weight:700;touch-action:none}
  #touch button.on{background:rgba(255,255,255,.45)}
  #pauseBtn{display:none;position:fixed;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18);color:#fff;font-weight:700;z-index:5}
  @media (pointer:coarse){#touch{display:flex}#pauseBtn{display:block}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="800" height="448"></canvas></div>
<button id="pauseBtn" onclick="togglePause()">II</button>
<div id="touch">
  <div><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
  <div><button data-k="fire">FOGO</button><button data-k="run">COR</button><button data-k="jump">PULA</button></div>
</div>

<script>
'use strict';
const T = 32, W = 800, H = 448, ROWS = 14;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function resize(){ const s = Math.min(innerWidth/W, innerHeight/H); cv.style.width = W*s+'px'; cv.style.height = H*s+'px'; }
addEventListener('resize', resize); resize();

/* ---------- Som ---------- */
let ac = null;
function initAudio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); }
function beep(f1, f2, dur, type='square', vol=.05, delay=0){
  if(!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
}
const SND = {
  jump: ()=>beep(300,640,.16),
  coin: ()=>{beep(988,988,.07); beep(1319,1319,.25,'square',.05,.07);},
  stomp: ()=>beep(260,80,.12),
  bump: ()=>beep(130,90,.08,'triangle',.1),
  brk: ()=>beep(200,40,.2,'sawtooth',.06),
  power: ()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,f,.09,'square',.05,i*.07)),
  hurt: ()=>beep(500,120,.3,'sawtooth',.06),
  die: ()=>[523,494,466,440,415,392].forEach((f,i)=>beep(f,f*.97,.12,'square',.05,i*.12)),
  win: ()=>[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,f,.16,'square',.05,i*.15)),
  pipe: ()=>beep(400,100,.35,'triangle',.08),
};


/* ---------- Música (composições originais, geradas por código) ---------- */
const mid = n => 440*Math.pow(2, (n-69)/12);
function tone(n, t, dur, type, vol){
  if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(mid(n), t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.015); g.gain.exponentialRampToValueAtTime(.0001, t+Math.max(.05,dur));
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.05);
}
// [nota MIDI (0 = pausa), duração em tempos]
const TRACKS = {
  over: { bpm:152,
    lead:[[76,.5],[79,.5],[84,1],[79,.5],[76,.5],[72,1],  [74,.5],[77,.5],[83,1],[77,.5],[74,.5],[71,1],
          [72,.5],[76,.5],[79,1],[76,.5],[72,.5],[67,1],  [69,.5],[72,.5],[76,1],[74,1],[72,1],
          [77,.5],[81,.5],[84,1],[81,.5],[77,.5],[74,1],  [76,.5],[79,.5],[83,1],[79,.5],[76,.5],[71,1],
          [72,.5],[74,.5],[76,.5],[79,.5],[81,1],[79,1],  [77,1],[74,1],[72,2]],
    bass:[48,55,48,55, 43,50,43,50, 45,52,45,52, 41,48,41,48, 41,48,41,48, 48,55,48,55, 43,50,43,50, 48,55,48,48].map(n=>[n,1]) },
  castle:{ bpm:124,
    lead:[[57,.5],[57,.5],[64,.5],[57,.5],[63,.5],[57,.5],[62,.5],[57,.5],  [55,.5],[55,.5],[62,.5],[55,.5],[61,.5],[55,.5],[60,.5],[55,.5],
          [53,.5],[53,.5],[60,.5],[53,.5],[59,.5],[53,.5],[58,.5],[53,.5],  [52,.5],[52,.5],[59,.5],[52,.5],[56,1],[0,1]],
    bass:[[33,2],[33,2],[31,2],[31,2],[29,2],[29,2],[28,2],[28,2]] },
  under:{ bpm:112,
    lead:[[57,.5],[60,.5],[64,.5],[60,.5],[57,.5],[60,.5],[64,.5],[60,.5],  [55,.5],[59,.5],[62,.5],[59,.5],[55,.5],[59,.5],[62,.5],[59,.5],
          [53,.5],[57,.5],[60,.5],[57,.5],[53,.5],[57,.5],[60,.5],[57,.5],  [52,.5],[56,.5],[59,.5],[56,.5],[64,1],[0,1]],
    bass:[[45,4],[43,4],[41,4],[40,4]] },
};
const Music = {on:true, cur:null, timer:null, tL:0, tB:0, iL:0, iB:0};
function musicTick(){
  const tr = TRACKS[Music.cur]; if(!tr || !ac) return;
  const spb = 60/tr.bpm, horizon = ac.currentTime + .5;
  while(Music.tL < horizon){ const [n,b] = tr.lead[Music.iL % tr.lead.length]; if(n) tone(n, Music.tL, b*spb*.85, 'square', .018); Music.tL += b*spb; Music.iL++; }
  while(Music.tB < horizon){ const [n,b] = tr.bass[Music.iB % tr.bass.length]; if(n) tone(n, Music.tB, b*spb*.9, 'triangle', .05); Music.tB += b*spb; Music.iB++; }
}
function musicStop(){ clearInterval(Music.timer); Music.timer = null; Music.cur = null; }
function musicStart(name){
  if(!ac || !Music.on || !TRACKS[name]) return;
  musicStop(); Music.cur = name; Music.iL = Music.iB = 0; Music.tL = Music.tB = ac.currentTime + .08;
  Music.timer = setInterval(musicTick, 90); musicTick();
}
function musicSync(){ // escolhe a trilha conforme o estado e o tema da área
  const want = (state==='play' || state==='warp') ? (theme==='castle' ? 'castle' : theme==='under' ? 'under' : 'over') : null;
  if(!ac || !Music.on){ if(Music.cur) musicStop(); return; }
  if(want !== Music.cur){ if(want) musicStart(want); else musicStop(); }
}
function musicToggle(){ Music.on = !Music.on; if(!Music.on) musicStop(); }

/* ---------- Entrada ---------- */
const keys = {}, touch = {left:false,right:false,down:false,jump:false,run:false,fire:false};
const inp = {left:false,right:false,down:false,jump:false,run:false,fire:false};
let jumpBuf = 0, prevJump = false, fireBuf = 0, prevFire = false;
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  initAudio();
  if(!keys[e.code]){
    keys[e.code] = true;
    if(state==='title'){ // escolher a fase (para testes)
      const n = LEVELS.length;
      if(['ArrowLeft','ArrowUp','KeyA','KeyW'].includes(e.code)) selLevel = (selLevel+n-1)%n;
      else if(['ArrowRight','ArrowDown','KeyD','KeyS'].includes(e.code)) selLevel = (selLevel+1)%n;
      else if(/^Digit[1-9]$/.test(e.code) && +e.code.slice(5)-1 < n) selLevel = +e.code.slice(5)-1;
    }
    if(e.code==='KeyM') musicToggle();
    if(e.code==='KeyP' || e.code==='Escape') togglePause();
    if(e.code==='Enter'||e.code==='Space') advance();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); initAudio(); touch[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); touch[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
cv.addEventListener('pointerdown', ev => {
  initAudio();
  if(state==='title'){ // toque nas laterais da faixa de seleção troca de fase
    const r = cv.getBoundingClientRect(), fx = (ev.clientX-r.left)/r.width, fy = (ev.clientY-r.top)/r.height, n = LEVELS.length;
    if(fy > .84){ if(fx < .45) selLevel = (selLevel+n-1)%n; else if(fx > .55) selLevel = (selLevel+1)%n; else advance(); return; }
  }
  advance();
});
document.addEventListener('visibilitychange', () => { if(document.hidden && state!=='title' && state!=='over' && state!=='win') paused = true; });
function readInput(){
  inp.left  = keys.ArrowLeft || keys.KeyA || touch.left;
  inp.right = keys.ArrowRight || keys.KeyD || touch.right;
  inp.down  = keys.ArrowDown || keys.KeyS || touch.down;
  inp.jump  = keys.ArrowUp || keys.KeyW || keys.Space || touch.jump;
  inp.run   = keys.ShiftLeft || keys.ShiftRight || keys.KeyX || keys.KeyZ || touch.run;
  if(inp.jump && !prevJump) jumpBuf = 8;
  prevJump = inp.jump;
  inp.fire = keys.KeyC || keys.KeyF || touch.fire;
  if(inp.fire && !prevFire) fireBuf = 6;
  prevFire = inp.fire;
}

/* ---------- Fases ---------- */
// Ficam em LEVELS: cada fase tem um nome e uma função que monta as áreas ('main' e, opcionalmente, 'under').
let COLS = 212, POLE = -1, isUnder = false, theme = 'over', lifts = [], A = {}, notice = null;
let fireBars = [], podoboos = [], boss = null, bossFire = [], axeT = 0;
let grid, enemies, items, parts, bumps, coinHits, player, fireballs = [];
const store = {};
let area = 'main';
const SOLID = 'GgBS?MTLCUub[]{}()-_knr';

function solid(tx, ty){
  if(tx < 0 || tx >= COLS) return true;
  if(ty < 0 || ty >= ROWS) return false;
  return SOLID.includes(grid[ty][tx]);
}
function solidH(tx, ty){ // sólido para colisão lateral e por baixo (a copa de cogumelo só vale por cima)
  return solid(tx,ty) && !(ty>=0 && ty<ROWS && grid[ty][tx]==='k');
}
function emptyGrid(cols){ return Array.from({length:ROWS}, () => Array(cols).fill('.')); }
function gridTools(g, cols){
  const set = (x,y,c) => { if(x>=0&&x<cols&&y>=0&&y<ROWS) g[y][x] = c; };
  return {
    set,
    ground:(a,b)=>{ for(let x=a;x<=b;x++){ set(x,12,'G'); set(x,13,'g'); } },
    pipe:(x,h)=>{ const top = 12-h; set(x,top,'['); set(x+1,top,']'); for(let y=top+1;y<12;y++){ set(x,y,'{'); set(x+1,y,'}'); } },
    row:(x0,x1,y,c)=>{ for(let x=x0;x<=x1;x++) set(x,y,c); },
    stairs:(x0,heights)=>{ heights.forEach((h,i)=>{ for(let k=1;k<=h;k++) set(x0+i,12-k,'S'); }); },
  };
}
// Inimigos: cx = centro em blocos, row = linha do topo do chão onde ele pisa
function mk(type, cx, row=12){
  const hh = type==='koopa' ? 36 : 28;
  return {type, x:cx*T-14, y:row*T-hh, w:28, h:hh, vx:0, vy:0, dir:-1, dead:0, t:0, shell:0, kick:0};
}
function mkPara(cx, cyRow, red, ph){ // Koopa voador: bobbing vertical em torno da linha cyRow
  return {type:'para', x:cx*T-14, x0:cx*T-14, y:cyRow*T-18, y0:cyRow*T-18, w:28, h:36, vx:0, vy:0, dir:-1, dead:0, t:ph, ph, amp:2*T, red, shell:0, kick:0};
}
function mkPir(col, topRow, t0=0){ // planta piranha dentro de um cano (col = coluna esquerda do cano)
  return {type:'piranha', x:col*T+18, y:topRow*T, base:topRow*T, w:28, h:0, vx:0, vy:0, dir:1, dead:0, t:t0, shell:0, kick:0};
}

// Fase 1-1, transcrita do mapa (posições em blocos a partir do início da fase)
function buildMain(){
  const g = emptyGrid(212), t = gridTools(g,212);
  t.ground(0,68); t.ground(71,85); t.ground(89,152); t.ground(155,211);
  [[28,2],[38,3],[46,4],[57,4],[163,2],[179,2]].forEach(p => t.pipe(...p));
  // blocos baixos (linha 8) e altos (linha 4)
  const B = [[16,8,'?'],[20,8,'B'],[21,8,'M'],[22,8,'B'],[23,8,'?'],[24,8,'B'],[22,4,'?'],
    [64,8,'I'],
    [77,8,'B'],[78,8,'M'],[79,8,'B'],
    [94,8,'C'],[100,8,'T'],[101,8,'B'],
    [106,8,'?'],[109,8,'M'],[112,8,'?'],[109,4,'?'],
    [118,8,'B'],
    [129,8,'B'],[130,8,'B'],
    [168,8,'B'],[169,8,'B'],[170,8,'?'],[171,8,'B']];
  B.forEach(([x,y,c]) => t.set(x,y,c));
  t.row(80,87,4,'B'); t.row(91,93,4,'B'); t.set(94,4,'?');
  t.row(121,123,4,'B'); t.set(128,4,'B'); t.set(129,4,'?'); t.set(130,4,'?'); t.set(131,4,'B');
  // escadas
  t.stairs(134,[1,2,3,4]); t.stairs(140,[4,3,2,1]); t.stairs(148,[1,2,3,4,4]); t.stairs(155,[4,3,2,1]);
  t.stairs(181,[1,2,3,4,5,6,7,8,8]);
  t.set(POLE,11,'Z');
  const en = [22,40,51,53,80,82,97,99,114,115,122,124,128,130,174,176].map(c => mk('goomba', c+.5));
  en.push(mk('koopa', 107.5));
  return {grid:g, enemies:en, items:[], cols:212, theme:'over', flag:{col:198, castle:203}, castles:[203],
    downPipes:[{col:57, topRow:8, to:{area:'under', x:2.5}}]};
}
// Sala secreta (entrada: cano em x=57, saída: cano horizontal)
function buildUnder(){
  const g = emptyGrid(20), t = gridTools(g,20);
  t.row(0,19,12,'u'); t.row(0,19,13,'u');
  for(let y=2;y<=11;y++) t.set(0,y,'u');
  for(let y=0;y<=11;y++) t.set(19,y,'u');
  t.row(6,12,2,'u');
  for(let y=9;y<=11;y++) t.row(6,12,y,'u');
  t.row(6,12,8,'c'); t.row(6,12,6,'c'); t.row(7,11,4,'c');
  for(let y=0;y<=11;y++){ t.set(17,y,'{'); t.set(18,y,'}'); }
  t.set(15,10,'('); t.set(15,11,')'); t.set(16,10,'-'); t.set(16,11,'_');
  return {grid:g, enemies:[], items:[], cols:20, theme:'under',
    sidePipes:[{col:15, r0:10, r1:11, to:{area:'main', x:164, feetRow:10}}]};
}
// Fase 1-2, transcrita do mapa: superfície inicial -> corredor subterrâneo (+ sala de bônus) -> superfície final
function buildStart12(){
  const g = emptyGrid(25), t = gridTools(g,25);
  t.ground(0,24); t.pipe(12,4);
  t.set(10,10,'('); t.set(10,11,')'); t.set(11,10,'-'); t.set(11,11,'_');
  return {grid:g, enemies:[], items:[], cols:25, theme:'over', castles:[0], spawn:{x:6.5},
    sidePipes:[{col:10, r0:10, r1:11, to:{area:'main', x:3.5}}]};
}
function buildMain12(){
  const N = 187, g = emptyGrid(N), t = gridTools(g,N);
  const floor = (a,b) => { t.row(a,b,12,'u'); t.row(a,b,13,'u'); };
  [[0,77],[81,116],[119,120],[123,134],[142,149],[156,186]].forEach(([a,b]) => floor(a,b));
  for(let y=1;y<=11;y++){ t.set(0,y,'u'); t.set(185,y,'u'); t.set(186,y,'u'); }
  t.row(6,134,1,'u'); t.row(157,182,1,'u'); t.set(87,1,'B');
  // começo: barra de blocos e pilares de pedra
  t.set(10,8,'M'); t.row(11,14,8,'B');
  t.stairs(16,[1,2]);
  [[19,2],[21,3],[23,4],[25,4],[27,3],[31,3],[33,2]].forEach(([x,hh]) => { for(let k=1;k<=hh;k++) t.set(x,12-k,'S'); });
  t.set(29,7,'?');
  // estruturas de tijolos azuis e moedas
  for(let y=6;y<=8;y++){ t.set(38,y,'b'); t.set(40,y,'b'); }
  t.set(39,7,'c'); t.row(41,43,6,'b'); t.set(43,7,'b'); t.set(43,8,'b'); t.set(44,7,'c');
  t.set(45,6,'?'); t.set(45,7,'b'); t.set(45,8,'b'); t.row(40,43,4,'c');
  for(let y=4;y<=7;y++){ t.set(51,y,'b'); t.set(52,y,'b'); }
  t.row(53,54,2,'b'); t.row(53,54,3,'b'); for(let y=8;y<=10;y++) t.row(53,54,y,'b');
  t.row(56,59,2,'b'); t.row(56,59,3,'b'); for(let y=2;y<=8;y++) t.row(60,61,y,'b');
  t.row(56,59,8,'b'); t.row(56,59,7,'c');
  t.row(65,68,2,'b'); t.row(65,68,3,'b'); for(let y=4;y<=8;y++) t.set(65,y,'b');
  t.row(66,67,8,'b'); t.set(66,7,'c'); t.set(67,7,'?');
  for(let y=4;y<=8;y++) t.set(70,y,'b'); for(const y of [4,5,6,8]) t.set(71,y,'b'); t.set(71,7,'c');
  t.row(74,77,2,'b'); t.row(74,77,3,'b'); t.row(74,77,8,'b');
  t.row(82,87,4,'c'); t.row(82,87,6,'b'); t.row(82,87,7,'b');
  // canos com plantas piranha (o primeiro leva à sala de bônus)
  t.pipe(100,3); t.pipe(106,4); t.pipe(112,2);
  for(let y=9;y<=11;y++) t.row(119,120,y,'b');
  t.stairs(130,[1,2,3,4,5]);
  t.row(142,146,7,'b'); t.set(147,7,'?');
  // massa de tijolos e cano de saída em L
  for(let y=9;y<=11;y++) t.row(156,165,y,'b');
  for(let y=1;y<=11;y++) t.row(166,172,y,'b');
  t.set(164,1,'['); t.set(165,1,']'); for(let y=2;y<=8;y++){ t.set(164,y,'{'); t.set(165,y,'}'); }
  t.set(162,7,'('); t.set(162,8,')'); t.set(163,7,'-'); t.set(163,8,'_');
  // zona de teletransporte
  t.pipe(174,3); t.pipe(178,3); t.pipe(182,3);
  const en = [16.1,28.7,60.9,62.9,96.95,98.5,99.4,110.6].map(c => mk('goomba', c));
  en.push(mk('goomba',74.6,8), mk('goomba',76,8), mk('goomba',71.5,4));
  [43.3,44.9,58,142.9].forEach(c => en.push(mk('koopa', c)));
  en.push(mkPir(100,9,0), mkPir(106,8,50), mkPir(112,10,100));
  const lf = (col,row,vy) => ({x:col*T, y:row*T, w:3*T, h:12, vy});
  return {grid:g, enemies:en, items:[], cols:N, theme:'under',
    lifts:[lf(136,6,1.2), lf(136,12,-1.2), lf(151,4,1.2), lf(151,12,-1.2)],
    downPipes:[{col:100, topRow:9, to:{area:'bonus', x:2.5}},
               {col:174, topRow:9, to:{warp:'4-1'}}, {col:178, topRow:9, to:{warp:'3-1'}}, {col:182, topRow:9, to:{warp:'2-1'}}],
    sidePipes:[{col:162, r0:7, r1:8, to:{area:'exit', x:4, feetRow:10}}],
    labels:[{text:'BEM-VINDO À ZONA DE TELETRANSPORTE!', col:178.5, row:5.2, size:15},
            {text:'4', col:175, row:8}, {text:'3', col:179, row:8}, {text:'2', col:183, row:8}]};
}
function buildBonus12(){
  const g = emptyGrid(17), t = gridTools(g,17);
  t.row(0,16,12,'u'); t.row(0,16,13,'u');
  for(let y=2;y<=11;y++) t.set(0,y,'u');
  for(let y=2;y<=5;y++) t.row(3,14,y,'u');
  for(let y=6;y<=9;y++) t.row(13,14,y,'u');
  t.row(3,11,9,'u'); t.row(3,11,11,'c'); t.row(4,11,8,'c'); t.set(12,9,'c');
  for(let y=0;y<=11;y++){ t.set(15,y,'{'); t.set(16,y,'}'); }
  t.set(13,10,'('); t.set(13,11,')'); t.set(14,10,'-'); t.set(14,11,'_');
  return {grid:g, enemies:[], items:[], cols:17, theme:'under',
    sidePipes:[{col:13, r0:10, r1:11, to:{area:'main', x:113, feetRow:10}}]};
}
function buildExit12(){
  const N = 42, g = emptyGrid(N), t = gridTools(g,N);
  t.ground(0,N-1); t.pipe(3,2); t.stairs(5,[1,2,3,4,5,6,7,8,8]); t.set(22,11,'Z');
  return {grid:g, enemies:[], items:[], cols:N, theme:'over', flag:{col:22, castle:26}, castles:[26]};

/* ---------- Física ---------- */
function collideX(e){
  const top = Math.floor(e.y/T), bot = Math.floor((e.y+e.h-.01)/T);
  const l = Math.floor(e.x/T), r = Math.floor((e.x+e.w-.01)/T);
  for(let ty=top; ty<=bot; ty++){
    if(e.vx>0 && solidH(r,ty)){ e.x = r*T-e.w; e.vx = 0; return true; }
    if(e.vx<0 && solidH(l,ty)){ e.x = (l+1)*T; e.vx = 0; return true; }
  }
  return false;
}
function collideY(e){
  const l = Math.floor(e.x/T), r = Math.floor((e.x+e.w-.01)/T);
  const top = Math.floor(e.y/T), bot = Math.floor((e.y+e.h-.01)/T);
  e.headHit = -1;
  if(e.vy>0){
    const oldBottom = e.y - e.vy + e.h;
    for(let tx=l; tx<=r; tx++){
      if(!solid(tx,bot)) continue;
      if(grid[bot][tx]==='k' && oldBottom > bot*T + 1) continue; // já estava dentro/abaixo da copa: atravessa
      e.y = bot*T-e.h; e.vy = 0; e.onGround = true; return;
    }
  } else if(e.vy<0){
    let best = -1, bd = 1e9;
    for(let tx=l; tx<=r; tx++){
      const hidden = e.isPlayer && grid[top] && grid[top][tx]==='I';
      if(solidH(tx,top) || hidden){ const d = Math.abs(tx*T+T/2-(e.x+e.w/2)); if(d<bd){ bd = d; best = tx; } }
    }
    if(best>=0){ e.y = (top+1)*T; e.vy = 0; e.headHit = best; }
  }
}
function move(e){ e.x += e.vx; const hx = collideX(e); e.onGround = false; e.y += e.vy; collideY(e); return hx; }

/* ---------- Ações ---------- */
function popText(x, y, text){ parts.push({type:'text', x, y, t:0, text}); }
const CHAIN = [100,200,400,500,800,1000,2000,4000,5000,8000];
function stompScore(e){ // pisões seguidos (e mortes com a estrela) valem cada vez mais; depois vira vida extra
  const i = stompChain++;
  if(i>=CHAIN.length){ lives++; popText(e.x, e.y-10, '1UP'); SND.power(); } else addScore(CHAIN[i], e.x, e.y-10);
}
function shellScore(shell, o){ // inimigos derrubados por um casco em movimento
  const SC = [500,800,1000,2000,4000,5000,8000], i = shell.kills = (shell.kills||0);
  shell.kills++;
  if(i>=SC.length){ lives++; popText(o.x, o.y-10, '1UP'); SND.power(); } else addScore(SC[i], o.x, o.y-10);
}
function addScore(n, x, y){ score += n; if(x!==undefined) popText(x, y, String(n)); }
function addCoin(){ coinCount++; if(coinCount>=100){ coinCount -= 100; lives++; } }
function coinPop(tx, ty){
  parts.push({type:'coin', x:tx*T+10, y:ty*T-8, vy:-8, t:0});
  addCoin(); addScore(200, tx*T+4, ty*T-20); SND.coin();
}
function spawnItem(tx, ty, kind){
  items.push({x:tx*T+2, y:ty*T, w:28, h:28, vx:0, vy:0, dir:1, rise:28, onGround:false, kind});
}
function hitBlock(tx, ty){
  const c = grid[ty][tx];
  bumps[tx+','+ty] = 0;
  if(c==='?'){ grid[ty][tx] = 'U'; coinPop(tx, ty); }
  else if(c==='C'){
    const k = tx+','+ty; coinHits[k] = (coinHits[k]||0)+1; coinPop(tx, ty);
    if(coinHits[k]>=10) grid[ty][tx] = 'U';
  }
  else if(c==='I'){ grid[ty][tx] = 'U'; SND.bump(); spawnItem(tx, ty, 'life'); }
  else if(c==='M'||c==='T'||c==='L'){
    grid[ty][tx] = 'U'; SND.bump();
    spawnItem(tx, ty, c==='T' ? 'star' : c==='L' ? 'life' : (player.big ? 'flower' : 'mush'));
  } else if(c==='B' || c==='b'){
    if(player.big){
      grid[ty][tx] = '.'; SND.brk(); score += 50;
      for(const [dx,dy] of [[-3,-9],[3,-9],[-2,-5],[2,-5]]) parts.push({type:'brick', x:tx*T+T/2, y:ty*T+T/2, vx:dx, vy:dy, t:0, col:c==='b'?'#1f8a9a':'#c84c0c'});
    } else SND.bump();
  } else SND.bump();
  // derruba inimigos em cima do bloco
  for(const en of enemies) if(!en.dead && Math.abs((en.y+en.h)-ty*T)<4 && en.x+en.w>tx*T && en.x<tx*T+T){ en.dead = 30; addScore(100, en.x, en.y-10); }
}
function grow(){
  if(player.big){ addScore(1000, player.x, player.y-10); return; }
  player.big = true; player.y -= 30; player.h = 60; addScore(1000, player.x, player.y-10); SND.power();
}
function collect(kind){
  if(kind==='mush') grow();
  else if(kind==='flower'){ if(!player.big) grow(); else { player.fire = true; addScore(1000, player.x, player.y-10); SND.power(); } }
  else if(kind==='star'){ player.star = 600; addScore(1000, player.x, player.y-10); SND.power(); }
  else if(kind==='life'){ lives++; popText(player.x, player.y-10, '1UP'); SND.power(); }
}
function hurt(){
  if(player.inv>0 || player.dead || player.star>0 || player.grace>0) return;
  if(player.big){ player.big = false; player.fire = false; player.y += 30; player.h = 30; player.inv = 120; SND.hurt(); }
  else die();
}
let deadFreeze = 0;
function die(fell){ // morte: o jogo congela um instante com o Mario na pose de morte; depois ele pula e cai (em buraco, só cai)
  if(player.dead) return;
  player.dead = 1; player.vx = 0; player.vy = 0; state = 'dead'; deadTimer = 0; warp = null;
  if(player.h>30) player.y += player.h-30;
  player.big = false; player.fire = false; player.h = 30; player.star = 0; player.inv = 0;
  deadFreeze = fell ? 0 : 32; SND.die();
}
function startWarp(to, down){
  if(to.warp){
    const idx = LEVELS.findIndex(l => l.name===to.warp);
    if(idx<0){ if(!notice) notice = {text:'FASE '+to.warp+' AINDA NÃO CRIADA', t:150}; return; }
    to = {level:idx};
  }
  warp = {t:0, to, down:!!down}; state = 'warp'; player.vx = 0; SND.pipe();
}

/* ---------- Atualização ---------- */
function updatePlayer(){
  const p = player;
  if(state==='dead'){
    if(deadFreeze>0){ if(--deadFreeze===0) p.vy = -11.5; return; }   // pausa com a pose de morte
    p.vy = Math.min(p.vy+.6, 14); p.y += p.vy; return;
  }
  if(state==='flag'){
    p.vy = 0; p.y += 2.6; flagY = Math.max(flagY, p.y);
    if(p.y+p.h >= 12*T){ p.y = 12*T-p.h; state = 'walk'; walkTimer = 0; p.facing = 1; p.x = POLE*T+22; }
    return;
  }
  if(state==='axe'){ p.vy = Math.min(p.vy+.85,13); p.vx = 0; move(p); return; }
  if(state==='walk'){
    walkTimer++; p.vx = 2; p.vy = Math.min(p.vy+.85, 13);
    const hx = move(p); if(hx) p.vx = 0;
    p.walk += 2;
    const endX = A.toad ? A.toad.col*T-34 : (A.flag.castle+2)*T+8;
    if(p.x > endX || walkTimer>900){ if(A.toad) timeAtFlag = 0; startCount(); }
    return;
  }
  const dirIn = (inp.right?1:0) - (inp.left?1:0);
  if(dirIn!==0 && dirIn===p.facing && (p.onGround ? Math.abs(p.vx)>.5 || p.runTime>0 : true)) { if(p.onGround) p.runTime = Math.min(p.runTime+1, 90); }
  else if(p.onGround) p.runTime = 0;
  if(dirIn!==0 && dirIn!==Math.sign(p.vx||dirIn)) p.runTime = 0; // virou de direção: recomeça devagar
  const ramp = Math.min(1, p.runTime/90);
  const maxV = inp.run ? 4.6 : 2.9 + 1.7*ramp, acc = inp.run ? .3 : .2 + .08*ramp;
  if(inp.left && !inp.right){ p.vx -= p.vx>0 ? .6 : acc; p.facing = -1; }
  else if(inp.right && !inp.left){ p.vx += p.vx<0 ? .6 : acc; p.facing = 1; }
  else { p.vx *= p.onGround ? .82 : .985; if(Math.abs(p.vx)<.05) p.vx = 0; }
  p.vx = Math.max(-maxV, Math.min(maxV, p.vx));
  p.coyote = p.onGround ? 6 : p.coyote-1;
  if(jumpBuf>0){ jumpBuf--; if(p.coyote>0){ p.vy = -(11.4 + 1.3*Math.max(0, Math.min(1, (Math.abs(p.vx)-2.9)/1.7))); p.onGround = false; p.coyote = 0; jumpBuf = 0; SND.jump(); } }
  p.vy = Math.min(p.vy + (p.vy<0 ? (inp.jump ? .42 : .5) : .85), 13);
  const prevBottom = p.y + p.h;
  move(p);
  if(p.headHit>=0) hitBlock(p.headHit, Math.round(p.y/T)-1);
  if(lifts.length) rideLifts(p, prevBottom);
  if(p.x < Math.max(cam,0)){ p.x = Math.max(cam,0); p.vx = Math.max(0,p.vx); }
  if(p.inv>0) p.inv--;
  if(p.grace>0) p.grace--;
  if(p.star>0) p.star--;
  if(fireBuf>0){ fireBuf--; if(p.fire && fireballs.length<2){ fireballs.push({x:p.facing>0?p.x+p.w:p.x-12, y:p.y+p.h*.35, w:12, h:12, vx:0, vy:2, dir:p.facing}); fireBuf = 0; SND.stomp(); } }
  if(p.onGround && p.star<=0) stompChain = 0;
  if(p.onGround && Math.abs(p.vx)>.1) p.walk += Math.abs(p.vx); else if(!p.onGround) p.walk = 0;
  if(p.y > H+60){ die(true); return; }
  { const ty = Math.floor((p.y+p.h-4)/T), cx = Math.floor((p.x+p.w/2)/T);
    if(ty>=0 && ty<ROWS && grid[ty][cx]==='v'){ die(); return; } }
  // canos: descer em cima do cano ou entrar de lado
  if(inp.down && p.onGround) for(const d of A.downPipes||[]){
    if(p.x >= d.col*T-6 && p.x+p.w <= (d.col+2)*T+6 && Math.abs(p.y+p.h-d.topRow*T) < 2){
      p.x = d.col*T + (2*T-p.w)/2; startWarp(d.to, true); return;
    }
  }
  if(inp.right && p.onGround) for(const s of A.sidePipes||[]){
    if(p.x+p.w >= s.col*T-3 && p.x+p.w <= (s.col+1)*T && p.y+p.h > s.r0*T && p.y < (s.r1+1)*T){ startWarp(s.to, false); return; }
  }
  // bandeira
  if(POLE>=0){
    const px = POLE*T+14;
    if(p.x+p.w > px && p.x < px+4 && p.y+p.h > 2*T && p.y < 12*T){
      state = 'flag'; p.x = px-p.w+1; p.vx = 0; flagY = p.y; timeAtFlag = time;
      const hgt = (12*T-p.y-p.h)/T + 1;   // altura em blocos em que pegou o mastro
      const pts = hgt>=8 ? 5000 : hgt>=6 ? 2000 : hgt>=4 ? 800 : hgt>=2 ? 400 : 100;
      addScore(pts, px-30, p.y); SND.win();
    }
  }
}
// fim da fase: o tempo restante vira pontos (50 cada) e, se o último dígito for 1, 3 ou 6, tem fogos de artifício
function startCount(){
  state = 'count'; winBonus = 0; endWait = 0; fwTimer = 0;
  const d = timeAtFlag % 10; fwLeft = (d===1||d===3||d===6) ? d : 0;
}
function fireworkBurst(){
  const cx = (A.flag.castle+2.5)*T + (Math.random()-.5)*5*T, cy = (3 + Math.random()*2.5)*T;
  const col = ['#ff5040','#ffd030','#60e0ff','#ffffff','#80ff80'][Math.floor(Math.random()*5)];
  for(let i=0;i<18;i++){ const a = i/18*Math.PI*2, s = 2 + Math.random()*1.2; parts.push({type:'spark', x:cx, y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, t:0, col}); }
  addScore(500, cx, cy); beep(300,1100,.3,'triangle',.05); beep(120,60,.3,'sawtooth',.03,.15);
}
function updateCount(){
  if(time>0){ const d = Math.min(time,3); time -= d; score += 50*d; winBonus += 50*d; if(frame%3===0) beep(1400,1400,.03,'square',.03); return; }
  if(fwLeft>0){ if(++fwTimer>=40){ fwTimer = 0; fwLeft--; fireworkBurst(); } return; }
  if(++endWait>70){ state = 'win'; SND.win(); }
}

/* ---------- Castelo: barras de fogo, Podoboo, Bowser, ponte e machado ---------- */
const fbPoints = fb => Array.from({length:fb.n}, (_,k) => ({x:fb.cx+Math.cos(fb.ang)*k*16, y:fb.cy+Math.sin(fb.ang)*k*16}));
function updateHazards(){
  const p = player, live = (state==='play');
  for(const fb of fireBars){
    fb.ang += fb.spd;
    if(live && !p.dead) for(const q of fbPoints(fb)) if(q.x+5 > p.x && q.x-5 < p.x+p.w && q.y+5 > p.y && q.y-5 < p.y+p.h){ hurt(); break; }
  }
  for(const po of podoboos){
    po.t++;
    if(po.state===0){ if(po.t > po.wait){ po.state = 1; po.vy = -po.power; po.t = 0; } }
    else { po.vy += .45; po.y += po.vy; if(po.y >= po.y0){ po.y = po.y0; po.state = 0; po.t = 0; po.wait = 70 + Math.floor(Math.random()*130); } }
    if(live && !p.dead && po.state===1 && po.x+10 > p.x && po.x-10 < p.x+p.w && po.y+10 > p.y && po.y-10 < p.y+p.h) hurt();
  }
  if(boss) updateBoss();
  for(const f of bossFire){
    f.x += f.vx; f.t++;
    if(live && !p.dead && f.x < p.x+p.w && f.x+f.w > p.x && f.y < p.y+p.h && f.y+f.h > p.y) hurt();
  }
  bossFire = bossFire.filter(f => f.t < 260 && f.x > cam-80 && f.x < cam+W+80);
  // machado: corta a ponte
  if(A.axe && state==='play' && !p.dead){
    const ax = A.axe.col*T, ay = A.axe.row*T;
    if(p.x+p.w > ax+4 && p.x < ax+T && p.y+p.h > ay && p.y < ay+T){ grid[A.axe.row][A.axe.col] = '.'; startAxe(); }
  }
  if(state==='axe') updateAxe();
}
function updateBoss(){
  const b = boss, p = player;
  if(b.gone) return;
  b.t++;
  if(b.state==='fall'){ b.vy += .5; b.y += b.vy; b.x += b.vx; if(b.y > H+120) b.gone = true; return; }
  if(b.hit>0) b.hit--;
  b.dir = (p.x+p.w/2 < b.x+b.w/2) ? -1 : 1;
  if(b.t % 150 === 0) b.walk = [-1,1,-1,0,1][Math.floor(Math.random()*5)];
  b.x = Math.max(b.xmin, Math.min(b.xmax, b.x + (b.walk||0)*.6));
  if(b.onGround && b.t % 180 === 100){ b.vy = -7.5; b.onGround = false; }
  b.vy += .4; b.y += b.vy;
  if(b.y >= b.floorY-b.h){ b.y = b.floorY-b.h; b.vy = 0; b.onGround = true; }
  if(b.t % 120 === 60 && Math.abs(p.x-b.x) < 640){ // sopro de fogo
    bossFire.push({x:b.dir<0 ? b.x-30 : b.x+b.w, y:b.y+8+Math.floor(Math.random()*3)*20, w:32, h:12, vx:b.dir*2.8, t:0}); beep(200,90,.35,'sawtooth',.05);
  }
  if(state==='play' && !p.dead && p.x < b.x+b.w-6 && p.x+p.w > b.x+6 && p.y < b.y+b.h && p.y+p.h > b.y+4) hurt();
}
function hitBoss(){
  if(!boss || boss.gone || boss.state==='fall') return;
  boss.hp--; boss.hit = 12; beep(180,120,.12,'square',.05);
  if(boss.hp<=0) killBoss();
}
function killBoss(){
  if(!boss || boss.state==='fall') return;
  boss.state = 'fall'; boss.vy = -6; boss.vx = 0; addScore(5000, boss.x, boss.y-10); SND.stomp();
}
function startAxe(){
  state = 'axe'; axeT = 0; player.vx = 0; player.vy = 0; SND.win();
}
function updateAxe(){
  const br = A.bridge; axeT++;
  if(boss && boss.state!=='fall' && axeT===12){ boss.state = 'fall'; boss.vy = -2; boss.vx = 0; addScore(5000, boss.x, boss.y-10); }
  if(axeT>=12 && (axeT-12)%4===0){ // a ponte cai da direita para a esquerda
    const c = br.c1 - Math.floor((axeT-12)/4);
    if(c >= br.c0){ grid[br.row][c] = '.'; beep(160,70,.12,'square',.05); }
  }
  const done = br.c1-br.c0+1;
  if(axeT > 12 + done*4 + 40){ state = 'walk'; walkTimer = 0; player.facing = 1; }
}

function updateWarp(){
  const p = player;
  warp.t++;
  if(warp.t < 24 && warp.down) p.y += 1.2;
  if(warp.t === 24){
    const to = warp.to;
    if(to.level!==undefined){ levelIndex = to.level; resetLevel(); warp = {t:24, to, down:false}; state = 'warp'; }
    else {
      saveArea(); loadArea(to.area);
      p.x = to.x*T - p.w/2; p.vx = 0; p.vy = 0; p.rideLift = null;
      for(const e of enemies) if(e.type==='piranha'){ e.t = 0; e.h = 0; e.y = e.base; } // plantas voltam para dentro do cano
      p.y = to.feetRow!=null ? to.feetRow*T - p.h : -T;
      setCam();
    }
  }
  if(warp.t >= 48){ state = 'play'; warp = null; }
}
// plataformas móveis (elevadores)
function updateLifts(){
  const p = player;
  for(const l of lifts){
    const ox = l.x, oy = l.y;
    l.x += l.vx||0; l.y += l.vy||0;
    if(l.bx){ if(l.x<l.bx[0]){ l.x = l.bx[0]; l.vx = Math.abs(l.vx); } else if(l.x>l.bx[1]){ l.x = l.bx[1]; l.vx = -Math.abs(l.vx); } }
    if(l.by){ if(l.y<l.by[0]){ l.y = l.by[0]; l.vy = Math.abs(l.vy); } else if(l.y>l.by[1]){ l.y = l.by[1]; l.vy = -Math.abs(l.vy); } }
    else {
      if(l.vy>0 && l.y>H+10){ l.y = -16; if(p.rideLift===l) p.rideLift = null; }
      if(l.vy<0 && l.y<-16){ l.y = H+10; if(p.rideLift===l) p.rideLift = null; }
    }
    if(p.rideLift===l && !p.dead){ p.x += l.x-ox; p.y += l.y-oy; }
  }
}
function rideLifts(p, prevBottom){
  const over = l => p.x+p.w > l.x+3 && p.x < l.x+l.w-3;
  let on = null;
  if(p.vy>=0 && p.rideLift && over(p.rideLift)) on = p.rideLift; // quem já está em cima continua nela
  else if(p.vy>=0) for(const l of lifts){
    // pousa se estava acima da plataforma no quadro anterior
    if(over(l) && p.y+p.h >= l.y && prevBottom <= l.y - l.vy + .5){ on = l; break; }
  }
  if(on){ p.y = on.y - p.h; p.vy = 0; p.onGround = true; p.rideLift = on; }
  else p.rideLift = null;
}
function overlap(a, b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function updateEnemies(){
  const p = player, pvy0 = p.vy;   // pisões de um mesmo quadro usam a velocidade de antes do quique
  for(const e of enemies){
    if(e.dead){ if(--e.dead===0) e.remove = true; continue; }
    if(e.x > cam+W+80 || e.x < cam-160 || e.y>H+80) continue;
    if(e.type==='para'){
      e.t++;
      if(e.red) e.y = e.y0 + Math.sin(e.t/140*Math.PI*2)*e.amp;                      // vermelho: sobe e desce
      else { const a = e.t/170*Math.PI*2; e.x = e.x0 + Math.sin(a)*3*T; e.dir = Math.cos(a)>0 ? 1 : -1; } // verde: voa de um lado para o outro
      if(state==='play' && !p.dead && overlap(p,e)){
        if(p.star>0){ e.dead = 30; stompScore(e); SND.stomp(); }
        else if(pvy0>0 && (p.y+p.h)-e.y < 22){ // pisou: perde as asas e vira Koopa comum
          stompScore(e); SND.stomp(); p.vy = inp.jump ? -10.6 : -9; p.onGround = false; p.grace = 12;
          e.type = 'koopa'; e.vy = 0; e.dir = -1; e.shell = 0; e.kick = 8;
        } else hurt();
      }
      continue;
    }
    if(e.type==='piranha'){
      e.t++; let ph = e.t % 160;
      if(ph===60 && !p.dead && Math.abs((p.x+p.w/2)-(e.x+e.w/2)) < T*1.8){ e.t--; ph = 59; } // não sobe se o jogador está perto
      const vis = ph<60 ? 0 : ph<80 ? (ph-60)/20*32 : ph<140 ? 32 : (160-ph)/20*32;
      e.h = vis; e.y = e.base - vis;
      if(vis>6 && state==='play' && !p.dead && overlap(p,e)){
        if(p.star>0){ e.dead = 30; stompScore(e); SND.stomp(); } else hurt();
      }
      continue;
    }
    e.t++; if(e.kick>0) e.kick--;
    const spd = e.shell===2 ? 6 : e.shell===1 ? 0 : 1;
    e.vx = e.dir*spd; e.vy = Math.min(e.vy+.6, 12);
    if(e.onGround && e.shell===0){ // volta ao chegar na beira do buraco
      const lx = Math.floor((e.dir>0 ? e.x+e.w+1 : e.x-1)/T), ty = Math.floor((e.y+e.h+2)/T);
      if(!solid(lx,ty)){ e.dir = -e.dir; e.vx = e.dir; }
    }
    if(move(e)){ e.dir = -e.dir; if(e.shell===2) SND.bump(); }
    if(e.shell===2) for(const o of enemies) if(o!==e && !o.dead && overlap(e,o)){ o.dead = 30; shellScore(e, o); SND.stomp(); }
    if(state==='play' && !p.dead && overlap(p,e)){
      if(p.star>0){ e.dead = 30; stompScore(e); SND.stomp(); }
      else if(e.shell===1){ // casco parado: chuta
        e.shell = 2; e.dir = (p.x+p.w/2 < e.x+e.w/2) ? 1 : -1; e.kick = 15; addScore(400, e.x, e.y-10); SND.stomp();
      }
      else if(e.kick>0){ /* acabou de ser chutado */ }
      else if(pvy0>0 && (p.y+p.h)-e.y < 20){
        stompScore(e); SND.stomp(); p.vy = inp.jump ? -10.6 : -9; p.onGround = false; p.grace = 12;
        if(e.type==='koopa'){ if(e.shell===0){ e.y += e.h-28; e.h = 28; } e.shell = 1; e.kick = 8; }
        else e.dead = 30;
      } else hurt();
    }
  }
  enemies = enemies.filter(e => !e.remove && e.y < H+80);
}
function updateItems(){
  const p = player;
  for(const m of items){
    if(m.rise>0){ m.y -= 1; m.rise--; continue; }
    if(m.kind!=='flower'){
      m.vy = Math.min(m.vy+(m.kind==='star'?.5:.6), 12);
      m.vx = m.dir*(m.kind==='star'?2.5:2);
      if(move(m)) m.dir = -m.dir;
      if(m.kind==='star' && m.onGround) m.vy = -8;
    }
    if(overlap(p,m) && !p.dead){ m.gone = true; collect(m.kind); }
  }
  items = items.filter(m => !m.gone && m.y < H+60);
  // moedas soltas
  const l = Math.floor(p.x/T), r = Math.floor((p.x+p.w-1)/T), t = Math.floor(p.y/T), b = Math.floor((p.y+p.h-1)/T);
  for(let ty=t; ty<=b; ty++) for(let tx=l; tx<=r; tx++) if(grid[ty] && grid[ty][tx]==='c'){
    grid[ty][tx] = '.'; addCoin(); addScore(200, tx*T, ty*T-10); SND.coin();
  }
}
function updateFireballs(){
  for(const f of fireballs){
    f.vx = f.dir*6; f.vy = Math.min(f.vy+.6, 10);
    if(move(f)) f.dead = true;
    if(f.onGround) f.vy = -6;
    if(f.y>H+40 || f.x<cam-40 || f.x>cam+W+40) f.dead = true;
    if(boss && !boss.gone && boss.state!=='fall' && !f.dead && overlap(f,boss)){ f.dead = true; hitBoss(); }
    for(const e of enemies) if(!e.dead && !f.dead && overlap(f,e)){
      e.dead = 30; f.dead = true; addScore(200, e.x, e.y-10); SND.stomp();
    }
  }
  fireballs = fireballs.filter(f => !f.dead);
}
function updateParts(){
  for(const q of parts){
    q.t++;
    if(q.type==='coin'){ q.vy += .5; q.y += q.vy; }
    else if(q.type==='brick'){ q.vy += .6; q.x += q.vx; q.y += q.vy; }
    else if(q.type==='spark'){ q.vy += .06; q.x += q.vx; q.y += q.vy; }
    else q.y -= .8;
  }
  parts = parts.filter(q => q.t < (q.type==='text' ? 50 : q.type==='coin' ? 36 : q.type==='spark' ? 55 : 70));
  for(const k in bumps){ if(++bumps[k] > 8) delete bumps[k]; }
}
function togglePause(){ if(state!=='title' && state!=='over' && state!=='win') paused = !paused; }
function update(){
  frame++;
  readInput();
  if(paused){ if(Music.cur) musicStop(); return; }
  musicSync();
  if(state==='title'||state==='over'||state==='win'){ updateParts(); return; }
  if(state==='count'){ updateCount(); updateParts(); return; }
  if(state==='warp'){ updateWarp(); return; }
  updateLifts();
  updatePlayer();
  if(state==='play'||state==='flag'||state==='walk'||state==='axe'){ updateEnemies(); updateItems(); updateFireballs(); updateHazards(); }
  updateParts();
  if(notice && --notice.t<=0) notice = null;
  if(COLS*T<=W) cam = -(W-COLS*T)/2;
  else {
    const target = Math.max(0, Math.min(COLS*T-W, player.x - W*.4));
    if(target > cam) cam = target;
  }
  { const cp = LEVELS[levelIndex].checkpoint;
    if(state==='play' && cp && !cpReached && area===cp.area && player.x > cp.col*T){ cpReached = true; if(!notice) notice = {text:'PONTO DE RETORNO!', t:90}; } }
  if(state==='play' && ++timeTick >= 24){ timeTick = 0; if(--time <= 0){ time = 0; die(); } }
  if(state==='dead' && ++deadTimer > 150){
    lives--;
    if(lives<=0) state = 'over'; else { resetLevel(true); state = 'play'; }
  }
}

const BIG_ROWS = [[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,2],[8,2],[9,3],[10,3],[11,3],[12,3],[13,3],[14,4]]; // 15 linhas -> 30
const sprCache = {};
function getSprite(name, big, pal){
  const key = name+big+pal.join();
  if(sprCache[key]) return sprCache[key];
  const rows = SPR[name];
  const list = big ? BIG_ROWS.flatMap(([r,n]) => Array(n).fill(rows[r])) : rows;
  const c = document.createElement('canvas'); c.width = 12; c.height = list.length;
  const g = c.getContext('2d');
  const col = {R:pal[0], B:pal[1], S:'#fcb888', N:'#6b3a10', K:'#000', Y:'#fcd800', W:'#fff'};
  list.forEach((row,y) => { for(let x=0;x<12;x++){ const ch = row[x]; if(ch!=='.'){ g.fillStyle = col[ch]; g.fillRect(x,y,1,1); } } });
  return sprCache[key] = c;
}
const STAR_PALS = [['#e52521','#2038ec'],['#fcd800','#e52521'],['#00c000','#fcd800'],['#ffffff','#2038ec']];

const R = (x,y,w,h,c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };
function drawBackground(){
  if(theme==='under' || theme==='castle'){ R(0,0,W,H,'#000'); return; }
  R(0,0,W,H,'#5c94fc');
  const base = 12*T, off = Math.round(cam);
  // elementos fixos no mundo, repetidos a cada 48 blocos (como no jogo original)
  for(let k=Math.floor(cam/(48*T))-1; k<=Math.floor((cam+W)/(48*T)); k++){
    const o = k*48*T - off;
    // nuvens
    for(const [cx,cy,n] of [[8,3,1],[19,2,3],[27,3,1],[36,2,2],[43,3,3]]){
      const x = o+cx*T, y = cy*T;
      ctx.fillStyle = '#fff';
      for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(x+i*T*1.4+16,y+14,14,0,7); ctx.arc(x+i*T*1.4+34,y+8,16,0,7); ctx.arc(x+i*T*1.4+52,y+14,14,0,7); ctx.fill(); }
      ctx.fillRect(x+16,y+14,(n-1)*T*1.4+36,12);
    }
    if(A.noHills) continue;
    // colinas
    for(const [hx,big] of [[0,1],[16,0]]){
      const x = o+hx*T, w = (big?5:3)*T, h = (big?2:1)*T+8;
      ctx.fillStyle = '#00a800'; ctx.beginPath(); ctx.ellipse(x+w/2,base,w/2,h,0,Math.PI,0); ctx.fill();
      ctx.fillStyle = '#007800';
      for(const dx of (big?[.3,.55]:[.5])){ ctx.beginPath(); ctx.ellipse(x+w*dx,base-h*.45,4,7,0,0,7); ctx.fill(); }
    }
    // arbustos
    for(const [bx,n] of [[11,3],[23,1],[41,2],[47,3]]){
      const x = o+bx*T; ctx.fillStyle = '#58d854';
      for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(x+i*T+16,base-8,14,Math.PI,0); ctx.fill(); }
      ctx.fillRect(x+2,base-8,n*T-4,8);
    }
  }
}
function drawTile(c, x, y, tx, ty){
  const b = bumps[tx+','+ty]; if(b!==undefined) y -= Math.sin(b/8*Math.PI)*8;
  switch(c){
    case 'G': R(x,y,T,T,'#c84c0c'); R(x,y,T,9,'#58d854'); R(x,y+9,T,3,'#00a800'); R(x+6,y+16,4,4,'#8c2c00'); R(x+20,y+22,5,4,'#8c2c00'); break;
    case 'g': R(x,y,T,T,'#c84c0c'); R(x+4,y+6,6,5,'#8c2c00'); R(x+18,y+16,7,5,'#8c2c00'); R(x+8,y+26,5,4,'#8c2c00'); break;
    case 'B':
      R(x,y,T,T,'#c84c0c'); ctx.fillStyle = '#4a1800';
      for(let r=0;r<4;r++){ ctx.fillRect(x,y+r*8+7,T,1); const off = r%2?0:16; ctx.fillRect(x+off+8,y+r*8,1,8); if(off===0) ctx.fillRect(x+24,y+r*8,1,8); }
      R(x,y,T,1,'#f8a060'); break;
    case 'C': // tijolo com várias moedas (igual a um tijolo comum)
      drawTile('B', x, y + (b!==undefined ? Math.sin(b/8*Math.PI)*8 : 0), tx, ty); break;
    case '?': case 'M': case 'T': case 'L': {
      const pulse = Math.floor(frame/12)%4===3 ? '#fcd080' : '#fca044';
      R(x,y,T,T,'#8c4c00'); R(x+2,y+2,T-4,T-4,pulse);
      R(x+4,y+4,3,3,'#8c4c00'); R(x+T-7,y+4,3,3,'#8c4c00'); R(x+4,y+T-7,3,3,'#8c4c00'); R(x+T-7,y+T-7,3,3,'#8c4c00');
      ctx.fillStyle = '#5c2c00'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center'; ctx.fillText('?', x+17, y+24);
      ctx.fillStyle = '#fff'; ctx.fillText('?', x+16, y+23); ctx.textAlign = 'left'; break; }
    case 'U': R(x,y,T,T,'#6c4400'); R(x+2,y+2,T-4,T-4,'#a06c2c'); R(x+4,y+4,3,3,'#6c4400'); R(x+T-7,y+4,3,3,'#6c4400'); break;
    case 'k': { // copa de cogumelo
      const l = !grid[ty][tx-1] || grid[ty][tx-1]!=='k', r = grid[ty][tx+1]!=='k';
      R(x,y+2,T,T-4,'#3c9a1c'); R(x,y,T,6,'#8cd02c'); R(x,y+6,T,3,'#5cb020'); R(x,y+T-6,T,6,'#2a6a10');
      R(x+6,y+12,5,4,'#2a6a10'); R(x+20,y+16,5,4,'#2a6a10'); R(x+14,y+10,3,3,'#6cc024');
      if(l){ R(x,y,3,6,'#7ec6ff'); R(x,y+6,2,6,'#5c94fc'); R(x,y+T-6,3,6,'#5c94fc'); }
      if(r){ R(x+T-3,y,3,6,'#5c94fc'); R(x+T-2,y+6,2,6,'#5c94fc'); R(x+T-3,y+T-6,3,6,'#5c94fc'); }

// Planta piranha em pixel art (16x16). Metade esquerda desenhada; a direita é o espelho.
// G/D/L verdes, O laranja, B marrom, K preto, C creme, W cinza, V branco, S caule
const PIR_L = [
  '...DG...',
  '..DGCC..',
  '.DGOCCW.',
  'DGGGGCW.',
  'DGOGGCK.',
  'DGGGOGK.',
  'DGGGGGC.',
  'DOGGGGC.',
  'DGGGGGGK',
  '.DGGOGGK',
  'OOB....S',
  'BOOG...S',
  '.OOGO..S',
  '..OOGO.S',
  '...OOOOS',
  '....OOOS',
];
const PIR_PAL = {G:'#1f9a1f', D:'#0e6612', L:'#3cc43c', O:'#f9a03c', B:'#b8651c', K:'#000', C:'#fff1c8', W:'#a8a8a8', V:'#ececec', S:'#f79a2e'};
const pirCache = {};
function pirFrame(open){
  if(pirCache[open]) return pirCache[open];
  const rows = [];
  for(let y=0;y<16;y++){
    let l = PIR_L[y].split('');
    if(!open && y<=3){ // boca mais fechada: as pontas das folhas entram um bloco
      const last = l[7]; if(last==='.') { l.pop(); l.unshift('.'); }
    }
    const r = l.slice().reverse().map(c => c==='C' ? 'V' : c);
    rows.push(l.concat(r));
  }
  const c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const g = c.getContext('2d');
  rows.forEach((row,y) => row.forEach((ch,x) => {
    if(ch==='.') return;
    if(ch==='G'){ const k = (x*7 + y*13) % 9; ch = k===0 ? 'L' : k===4 ? 'D' : 'G'; }
    g.fillStyle = PIR_PAL[ch]; g.fillRect(x,y,1,1);
  }));
  return pirCache[open] = c;
}
function drawPiranha(e, x, y){
  if(e.h < 2) return;

  const hot = Math.floor(frame/6)%2;
  g.addColorStop(0, hot ? '#fffbb0' : '#fff070'); g.addColorStop(.55, '#ffc800'); g.addColorStop(1, '#f08400');
  ctx.fillStyle = g; starPath(cx,cy,13.5,6.4,wob); ctx.fill();
  // reflexo
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(cx-3,cy-8,2.2,4,-.5,0,7); ctx.fill();
  // olhos
  ctx.fillStyle = '#2a1000'; ctx.beginPath(); ctx.ellipse(cx-3.4,cy+1,1.9,3.4,0,0,7); ctx.ellipse(cx+3.4,cy+1,1.9,3.4,0,0,7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(cx-4.2,cy-1.4,1.2,1.4); ctx.fillRect(cx+2.6,cy-1.4,1.2,1.4);
  // brilhinhos
  ctx.fillStyle = '#fff'; const s = 2+2*Math.abs(Math.sin(frame/7)); sparkle(cx+15,cy-12,s); sparkle(cx-16,cy+10,4-s/2);
  ctx.restore();
}
function drawItem(m){
  const x = Math.round(m.x-cam), y = Math.round(m.y);
  if(m.kind==='mush' || m.kind==='life'){
    const cap = m.kind==='life' ? '#00b800' : '#e52521';
    ctx.fillStyle = cap; ctx.beginPath(); ctx.ellipse(x+14,y+14,14,14,0,Math.PI,0); ctx.fill();
    R(x,y+13,28,3,cap); R(x+4,y+16,20,12,'#fcd0a0'); R(x+9,y+19,3,5,'#000'); R(x+17,y+19,3,5,'#000');
    ctx.fillStyle = '#fff'; for(const [a,b] of [[7,7],[20,7],[14,3]]){ ctx.beginPath(); ctx.arc(x+a,y+b+3,3.5,0,7); ctx.fill(); }
  } else if(m.kind==='flower'){
    R(x+12,y+14,4,14,'#00a800'); R(x+5,y+20,8,4,'#00a800'); R(x+15,y+22,8,4,'#00a800');
    ctx.fillStyle = '#ff7a1a';
    for(let i=0;i<6;i++){ const an = i*Math.PI/3; ctx.beginPath(); ctx.arc(x+14+Math.cos(an)*8, y+10+Math.sin(an)*8, 5, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#fcd800'; ctx.beginPath(); ctx.arc(x+14,y+10,6,0,7); ctx.fill();
    ctx.fillStyle = '#e52521'; ctx.beginPath(); ctx.arc(x+14,y+10,3,0,7); ctx.fill();
  } else if(m.kind==='star') drawStar(x, y);
}
function drawFireballs(){
  for(const f of fireballs){
    const x = Math.round(f.x-cam+6), y = Math.round(f.y+6);
    ctx.fillStyle = '#e52521'; ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill();
    ctx.fillStyle = Math.floor(frame/3)%2 ? '#fcd800' : '#fca044'; ctx.beginPath(); ctx.arc(x,y,4.5,0,7); ctx.fill();
  }
}
function drawParts(){
  for(const q of parts){
    const x = Math.round(q.x-cam), y = Math.round(q.y);
    if(q.type==='coin'){ const w = Math.abs(Math.cos(q.t/3))*8+2; ctx.fillStyle = '#fcc800'; ctx.beginPath(); ctx.ellipse(x,y,w,11,0,0,7); ctx.fill(); }
    else if(q.type==='spark'){ ctx.globalAlpha = Math.max(0,1-q.t/55); ctx.fillStyle = q.col; ctx.fillRect(x-2,y-2,5,5); ctx.globalAlpha = 1; }
    else if(q.type==='brick'){ R(x,y,10,10,q.col||'#c84c0c'); R(x,y,10,2,'rgba(255,255,255,.4)'); }
    else { ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#000'; ctx.fillText(q.text,x+1,y+1); ctx.fillStyle = '#fff'; ctx.fillText(q.text,x,y); }
  }
}
function text(s, x, y, size=18, align='left', color='#fff'){
  ctx.font = `bold ${size}px monospace`; ctx.textAlign = align;
  ctx.fillStyle = '#000'; ctx.fillText(s, x+2, y+2); ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.textAlign = 'left';
}
function drawHUD(){
  text('SCORE', 24, 26, 16); text(String(score).padStart(6,'0'), 24, 46, 18);
  text('MOEDAS', 210, 26, 16); text('x'+String(coinCount).padStart(2,'0'), 230, 46, 18);
  text('FASE', 400, 26, 16); text(LEVELS[levelIndex].name, 410, 46, 18);
  text('TEMPO', 560, 26, 16); text(String(time).padStart(3,'0'), 575, 46, 18);
  text('VIDAS', 700, 26, 16); text('x'+lives, 718, 46, 18);
}
function overlay(title, lines, sub){
  ctx.fillStyle = 'rgba(0,0,30,.62)'; ctx.fillRect(0,0,W,H);
  text(title, W/2, 150, 54, 'center', '#fcd800');
  lines.forEach((l,i) => text(l, W/2, 215+i*28, 18, 'center'));
  if(Math.floor(frame/30)%2===0) text(sub, W/2, 215+lines.length*28+36, 20, 'center', '#fff');
}
function draw(){
  drawBackground();
  for(const m of items) drawItem(m);
  for(const e of enemies) if(e.type==='piranha') drawEnemy(e);
  drawTiles(); drawGoal();
  for(const e of enemies) if(e.type!=='piranha') drawEnemy(e);
  drawHazards(); drawPlayer(); drawFireballs(); drawParts();
  if(state==='warp' && warp){
    const a = warp.t<24 ? warp.t/24 : (48-warp.t)/24;
    ctx.fillStyle = `rgba(0,0,0,${Math.max(0,Math.min(1,a))})`; ctx.fillRect(0,0,W,H);
  }
  drawHUD();
  if(notice) text(notice.text, W/2, 100, 22, 'center', '#fcd800');
  if(state==='title') overlay('SUPER BROS', ['← → ou A D: andar    Espaço / ↑ / W: pular','Shift / X: correr    ↓ / S: entrar no cano    C / F: fogo','Cogumelo: cresce    Flor: bola de fogo    Estrela: invencível','Procure os canos secretos! (segure ↓ em cima do cano)    M: música    P: pausa'], 'Aperte ENTER ou toque para começar');
  if(state==='title'){
    text('◀   FASE '+LEVELS[selLevel].name+'   ▶', W/2, 408, 26, 'center', '#7fe0ff');
    text('← → ou números: escolher a fase', W/2, 432, 14, 'center', '#cfe8ff');
  }
  if(paused){ ctx.fillStyle = 'rgba(0,0,30,.55)'; ctx.fillRect(0,0,W,H); text('PAUSADO', W/2, 200, 56, 'center', '#fcd800'); text('Aperte P para continuar', W/2, 250, 20, 'center', '#fff'); }
  if(state==='over') overlay('FIM DE JOGO', ['Pontos: '+score], 'ENTER para jogar de novo');
  if(state==='win') overlay('FASE COMPLETA!', A.toad ? ['Obrigado, Mario!', 'Mas a nossa princesa está em outro castelo!', 'Pontos: '+score] : ['Pontos: '+score, 'Bônus de tempo: '+winBonus], levelIndex+1<LEVELS.length ? 'ENTER para a próxima fase' : 'ENTER para jogar de novo');
}

/* ---------- Loop ---------- */
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now-last); last = now;
  while(acc >= 1000/60){ update(); acc -= 1000/60; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__game = {get state(){return state}, get player(){return player}, get cam(){return cam}, get score(){return score}, keys};
</script>
